apiVersion: 1

datasources:
  - name: FlexeTrader DB
    type: postgres
    url: postgres:5432
    database: flexetrader
    user: flexetrader
    secureJsonData:
      password: flexetrader
    jsonData:
      sslmode: disable
      postgresVersion: 1500
      timescaledb: false

  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s

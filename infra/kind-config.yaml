kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      # App (FastAPI)
      - containerPort: 30800
        hostPort: 8000
        protocol: TCP
      # RabbitMQ Management
      - containerPort: 31672
        hostPort: 15672
        protocol: TCP
      # Grafana
      - containerPort: 30300
        hostPort: 3000
        protocol: TCP

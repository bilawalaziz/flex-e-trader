services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flexetrader
      POSTGRES_PASSWORD: flexetrader
      POSTGRES_DB: flexetrader
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"   # management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  app:
    build:
      context: .
      target: runtime 
    entrypoint: ["/app/entrypoint.sh"]
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - postgres
      - rabbitmq
      - redis
    volumes:
      - ./app:/app/app 
  
  celery-worker:
    build:
      context: .
      target: runtime
    command: celery -A app.celery_app worker --loglevel=info --concurrency=1
    env_file: .env
    environment:
      # Tasks run in forked children; without a shared directory their
      # counters never reach the exporter in the parent.
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus-multiproc
    ports:
      - "9100:9100"
    depends_on:
      - postgres
      - rabbitmq
      - redis
    volumes:
      - ./app:/app/app

  celery-beat:
    build:
      context: .
      target: runtime
    command: celery -A app.celery_app beat --loglevel=info
    env_file: .env
    depends_on:
      - postgres
      - rabbitmq
      - redis
    volumes:
      - ./app:/app/app
  
  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    depends_on:
      - app
      - celery-worker

  grafana:
    image: grafana/grafana-oss:10.4.0
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - postgres
      - prometheus
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml

volumes:
  pgdata:
  grafana-storage:
  prometheus-data: 
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flexetrader
      POSTGRES_PASSWORD: flexetrader
      POSTGRES_DB: flexetrader
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"   # management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  app:
    build:
      context: .
      target: runtime 
    entrypoint: ["/app/entrypoint.sh"]
    command: ["--reload"]
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - postgres
      - rabbitmq
      - redis
    volumes:
      - ./app:/app/app 

volumes:
  pgdata: 